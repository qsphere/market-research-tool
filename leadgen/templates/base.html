<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lead search{% endblock %} · Lead generation</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="brand">Lead generation</a>
      <a href="/history">History</a>
      <a href="/review">Review duplicates</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <p>Data: <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">{{ attribution }}</a>
      (ODbL). Results may be incomplete: phone and website tags are often missing.</p>
  </footer>
</body>
</html>
